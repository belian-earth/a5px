url: https://belian-earth.github.io/a5px/
development:
  mode: auto
template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: '#74ac90ff'
  math-rendering: mathjax
navbar:
  structure:
    left:
    - reference
    - intro
    - articles
    - news
    right:
    - search
    - github
  components:
    github:
      icon: fa-github
      href: https://github.com/belian-earth/a5px
      aria-label: GitHub
reference:
- title: Reading rasters
  desc: Aggregate GeoTIFF and COG pixels into A5 cells, from one file or several.
  contents:
  - a5_read_raster
  - a5_read_raster_arrow
  - a5_raster_to_parquet
- title: Decoding
  desc: Decode quantized values before aggregation.
  contents:
  - dequant_aef
- title: Inspecting sources
  desc: Raster metadata and object store configuration, without reading pixels.
  contents:
  - a5_raster_info
  - a5px_store_config
- title: Coarser resolutions
  desc: Summarise A5-keyed results at a coarser resolution without re-reading.
  contents:
  - a5_aggregate
- title: Writing
  desc: Write A5-keyed results to Parquet.
  contents:
  - a5px_write_parquet
- title: Configuration
  desc: Worker and fetch concurrency, and the session cache of remote reads.
  contents:
  - a5px_concurrency
  - a5px_set_cache
- title: Package overview
  desc: Common arguments, remote sources and supported formats.
  contents:
  - a5px-package
