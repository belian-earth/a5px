[package]
name = 'a5px'
publish = false
version = '0.2.0'
edition = '2021'
rust-version = '1.89'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'a5px'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
a5 = '=1.0.0'
async-tiff = { version = '0.4', default-features = false, features = ['object_store', 'reqwest', 'tokio'] }
object_store = { version = '0.14', features = ['aws', 'gcp', 'azure', 'http'] }
proj4rs = { version = '0.2', default-features = false, features = ['crs-definitions'] }
proj4wkt = '0.1'
tokio = { version = '1', features = ['rt-multi-thread', 'sync', 'macros', 'time'] }
rayon = '1.11'
futures = '0.3'
async-channel = '2'
async-trait = '0.1'
num_cpus = '1'
bytes = '1'
ahash = '0.8'
thiserror = '2'
# zlib-rs decodes deflate faster than flate2's default miniz_oxide; with
# the feature on, flate2 uses it for async-tiff too
flate2 = { version = '1', default-features = false, features = ['zlib-rs'] }
libc = '0.2'
url = '2'
arrow-array = '60'
arrow-buffer = '60'
arrow-schema = '60'
parquet = { version = '60', default-features = false, features = ['arrow', 'zstd', 'snap'] }

[profile.release]
lto = true
codegen-units = 1
