[package]
name = 'a5px'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.85'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'a5px'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
a5 = '0.7.3'
async-tiff = { version = '0.3', default-features = false, features = ['object_store', 'reqwest', 'tokio'] }
object_store = { version = '0.13', features = ['aws', 'gcp', 'azure', 'http'] }
proj4rs = { version = '0.1', default-features = false, features = ['crs-definitions'] }
tokio = { version = '1', features = ['rt-multi-thread', 'sync', 'macros'] }
rayon = '1.11'
futures = '0.3'
bytes = '1'
ahash = '0.8'
thiserror = '2'
url = '2'
arrow-array = '58'
arrow-buffer = '58'
arrow-schema = '58'
parquet = { version = '58', default-features = false, features = ['arrow', 'zstd', 'snap'] }

[profile.release]
lto = true
codegen-units = 1
